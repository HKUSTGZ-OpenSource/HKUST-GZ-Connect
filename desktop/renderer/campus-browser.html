<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self';" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>校园工作台</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="campus-browser.css" />
</head>
<body>
  <header class="browser-chrome">
    <div class="tabs-row">
      <div id="tabs" class="tabs" role="tablist" aria-label="网页标签" data-i18n-attr="aria-label:browser.tabs"></div>
      <div id="browserProfileContext" class="browser-profile-context">
        <span id="browserProfileName"></span>
        <span id="browserProfileTrust" class="browser-profile-trust" hidden data-i18n="school.unverified">未审核</span>
      </div>
      <button id="newTab" class="new-tab" title="新建标签页 (⌘T)" aria-label="新建标签页"
              data-i18n-attr="title:browser.newTabShortcut; aria-label:browser.newTab">+</button>
    </div>
    <div class="toolbar">
      <button id="back" class="icon" title="后退" aria-label="后退"
              data-i18n-attr="title:browser.back; aria-label:browser.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="forward" class="icon" title="前进" aria-label="前进"
              data-i18n-attr="title:browser.forward; aria-label:browser.forward">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button id="reload" class="icon" title="重新加载" aria-label="重新加载"
              data-i18n-attr="title:browser.reload; aria-label:browser.reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.3-5.6M20 3v5h-5"/></svg>
      </button>
      <button id="home" class="icon" title="学校官方门户主页" aria-label="学校官方门户主页"
              data-i18n-attr="title:browser.home; aria-label:browser.home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg>
      </button>
      <button id="credential" class="icon credential" title="此网站保存的密码"
              aria-label="管理此网站保存的密码"
              data-i18n-attr="title:browser.credentialTitle; aria-label:browser.credentialLabel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="8" cy="12" r="4"></circle>
          <path d="M12 12h8m-3 0v3m-3-3v2"></path>
        </svg>
      </button>
      <button id="favoritePage" class="icon favorite-page" title="收藏当前页面"
              aria-label="收藏当前页面" disabled
              data-i18n-attr="title:browser.favoritePage; aria-label:browser.favoritePage">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
      </button>
      <form id="addressForm">
        <input id="address" type="text" inputmode="url" spellcheck="false"
               aria-label="校园网站地址" placeholder="输入校园网站地址"
               data-i18n-attr="aria-label:browser.addressLabel; placeholder:browser.addressPlaceholder" />
        <span id="routeBadge" class="route-badge" title="当前网络路径：校园访问"
              data-i18n-attr="title:browser.viaCampus">校园访问</span>
        <select id="routeSelector" class="route-selector" aria-label="此标签的网络路径" title="选择此标签的网络路径"
                data-i18n-attr="aria-label:browser.routeLabel; title:browser.routeTitle">
          <option id="routeAutoOption" value="auto" data-i18n="browser.routeFollow">跟随规则</option>
          <option value="campus" data-i18n="browser.routeAlwaysCampus">始终使用校园隧道</option>
          <option value="direct" data-i18n="browser.routeAlwaysDirect">始终保持原网络</option>
        </select>
      </form>
      <button id="browserSettings" class="icon" title="打开设置"
              aria-label="打开设置"
              data-i18n-attr="title:browser.settings; aria-label:browser.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/>
        </svg>
      </button>
      <span id="state" class="state" data-i18n="browser.stateDefault">校园网络</span>
      <span id="downloadStatus" class="download-status" hidden></span>
    </div>
    <div id="bookmarkBar" class="bookmark-bar" aria-label="书签栏"
         data-i18n-attr="aria-label:browser.bookmarkBar">
      <div id="loadingBanner" class="loading-banner" role="status" aria-live="polite" hidden>
        <span class="loading-banner-indicator" aria-hidden="true"></span>
        <strong id="loadingBannerName">正在打开网站</strong>
        <span id="loadingBannerRoute">通过校园隧道</span>
      </div>
      <div id="bookmarkItems" class="bookmark-items"></div>
      <div id="bookmarkMoreWrap" class="bookmark-folder" hidden>
        <button id="bookmarkMore" class="bookmark-control" type="button" aria-expanded="false"
                title="更多书签" aria-label="更多书签"
                data-i18n-attr="title:browser.moreBookmarks; aria-label:browser.moreBookmarks">»</button>
      </div>
      <button id="manageBookmarks" class="bookmark-control bookmark-manage" type="button"
              data-i18n="browser.manageBookmarks">整理书签</button>
    </div>
    <div id="findBar" class="find-bar" hidden>
      <input id="findInput" type="text" spellcheck="false"
             aria-label="在页面中查找" placeholder="在页面中查找"
             data-i18n-attr="aria-label:browser.findLabel; placeholder:browser.findPlaceholder" />
      <button id="findPrev" class="icon find-button" title="上一个 (⇧+回车)" aria-label="上一个匹配"
              data-i18n-attr="title:browser.findPrev; aria-label:browser.findPrevLabel">↑</button>
      <button id="findNext" class="icon find-button" title="下一个 (回车)" aria-label="下一个匹配"
              data-i18n-attr="title:browser.findNext; aria-label:browser.findNextLabel">↓</button>
      <button id="findClose" class="icon find-button" title="关闭 (Esc)" aria-label="关闭查找栏"
              data-i18n-attr="title:browser.findClose; aria-label:browser.findCloseLabel">×</button>
    </div>
  </header>
  <script type="module" src="i18n.js"></script>
  <script defer="defer" src="campus-browser.js"></script>
</body>
</html>
