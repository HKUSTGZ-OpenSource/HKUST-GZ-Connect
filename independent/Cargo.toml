[package]
name = "ec-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
# Builds one explicitly selected, non-vendor post-Transport lifecycle seam into
# ec-engine for the subprocess regression only. Release/package builds must not
# enable this feature.
engine-lifecycle-fixture = []

[lib]
name = "ec_compat"
path = "src/lib.rs"

[[bin]]
name = "ec-watch"
path = "src/bin/ec-watch.rs"

[[bin]]
name = "ec-probe"
path = "src/bin/ec-probe.rs"

[[bin]]
name = "ec-binary-watch"
path = "src/bin/ec-binary-watch.rs"

[[bin]]
name = "ec-protocol-map"
path = "src/bin/ec-protocol-map.rs"

[[bin]]
name = "ec-adapter-check"
path = "src/bin/ec-adapter-check.rs"

[[bin]]
name = "ec-engine"
path = "src/bin/ec-engine.rs"

[[bin]]
name = "ec-proxy-command"
path = "src/bin/ec-proxy-command.rs"

[[bin]]
name = "ec-auth-fixture"
path = "src/bin/ec-auth-fixture.rs"

[dependencies]
base64 = "0.22"
flate2 = "1.1"
hex = "0.4"
hmac = "0.12"
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "std"] }
libc = "0.2"
md-5 = "0.10"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "macho", "pe"] }
rand = "0.8"
rc4 = { version = "0.2", features = ["zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "rustls-tls"] }
roxmltree = "0.20"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2.6"
tar = "0.4"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Maintained API-compatible fork. It guards blocked UDP receives with socket
# generations, preventing a stale handle panic when SOCKS UDP ASSOCIATE closes.
ts_netstack_smoltcp = { package = "geiserx_ts_netstack_smoltcp", version = "=0.43.0", features = ["std", "tokio"] }
url = "2"
webpki-roots = "1"
x509-parser = "0.18"
# Always build liblzma from the vendored source.  The default xz2/lzma-sys
# behavior prefers pkg-config, which can record a Homebrew-only absolute dylib
# path in a packaged macOS Engine and make it fail before main() on another Mac.
xz2 = { version = "0.1", features = ["static"] }
zeroize = "1"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
