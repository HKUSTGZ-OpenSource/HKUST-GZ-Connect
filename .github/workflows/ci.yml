name: ci

# The release workflow only runs on tags, so without this the desktop suite,
# syntax checks, and dependency audit would first run when a release is already
# being cut. Every push to the default branch and every pull request is gated
# here instead.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Reject committed secret patterns in the exact tree
        run: node desktop/scripts/check-sensitive-patterns.js --tree "$GITHUB_SHA"

  package-verifier-platform:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned Rust toolchain
        working-directory: independent
        run: rustup show active-toolchain
      - name: Install packaging dependencies
        run: npm ci

      - name: Build and stage shipped macOS/Linux native binaries
        if: matrix.platform != 'windows'
        run: ./scripts/build-engine.sh

      - name: Build and stage shipped Windows native binaries
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: independent
        run: |
          cargo build --locked --release --no-default-features --bin ec-engine --bin ec-proxy-command --bin ec-gateway-probe
          New-Item -ItemType Directory -Force -Path ../desktop/engine | Out-Null
          Copy-Item target/release/ec-engine.exe ../desktop/engine/ec-engine-windows-amd64.exe
          Copy-Item target/release/ec-proxy-command.exe ../desktop/engine/ec-proxy-command-windows-amd64.exe
          Copy-Item target/release/ec-gateway-probe.exe ../desktop/engine/ec-gateway-probe-windows-amd64.exe
          Copy-Item config/hkustgz.json ../desktop/engine/hkustgz.json

      - name: Build unpacked Linux application
        if: matrix.platform == 'linux'
        run: node node_modules/electron-builder/out/cli/cli.js --linux dir --x64 --publish never
      - name: Verify the exact Linux package
        if: matrix.platform == 'linux'
        run: node build/verify-package.js release/linux-unpacked/resources linux x64

      - name: Build Windows private-file helper
        if: matrix.platform == 'windows'
        run: npm run build:windows-private-file

      - name: Build unpacked Windows application
        if: matrix.platform == 'windows'
        run: node node_modules/electron-builder/out/cli/cli.js --win dir --x64 --publish never
      - name: Verify the exact Windows package
        if: matrix.platform == 'windows'
        run: node build/verify-package.js release/win-unpacked/resources win32 x64

      - name: Build and verify the exact macOS package
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          case "$(uname -m)" in
            arm64)
              package_arch=arm64
              output_dir=mac-arm64
              verifier_arch=arm64
              ;;
            x86_64)
              package_arch=x64
              output_dir=mac
              verifier_arch=x64
              ;;
            *)
              echo "unsupported macOS runner architecture" >&2
              exit 1
              ;;
          esac
          node node_modules/electron-builder/out/cli/cli.js \
            --mac dir "--${package_arch}" --publish never
          node build/verify-package.js \
            "release/${output_dir}/hkustgzconnect.app/Contents/Resources" darwin "${verifier_arch}"

  package-verifier:
    if: always()
    needs: package-verifier-platform
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform package verifier
        env:
          MATRIX_RESULT: ${{ needs.package-verifier-platform.result }}
        run: test "$MATRIX_RESULT" = success

  desktop:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        # The unit tests stub Electron, so the prebuilt binary is not needed and
        # its download would dominate the job runtime.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Run desktop tests
        run: npm test
      - name: Enforce desktop architecture growth boundaries
        run: npm run check:architecture
      - name: Enforce repository governance and immutable Actions
        run: npm run check:governance
      - name: Audit dependencies
        run: npm run audit:ci
      - name: Audit dependency install scripts
        run: npm run check:install-scripts
      - name: Check syntax of every entry point
        run: npm run check:syntax -- --tree "$GITHUB_SHA"
      - name: Check shell entry points
        run: |
          bash -n ../hkustgzconnect
          bash -n ../tools/mac-cli/proxy-credential.sh
          bash -n scripts/rebuild-mac.sh
          bash -n scripts/build-engine.sh

  desktop-electron:
    timeout-minutes: 15
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies including Electron runtime
        run: npm ci
      - name: Exercise the real Electron main process
        run: npm run test:main-integration
      - name: Exercise clean custom Profile startup
        run: npm run test:main-custom-profile
      - name: Exercise School selector and custom Gateway onboarding
        run: npm run test:main-school-onboarding
      - name: Exercise recoverable Profile switching and relaunch
        run: npm run test:main-profile-switch
      - name: Exercise control renderer crash-loop recovery
        run: npm run test:control-renderer-recovery
      - name: Exercise Main with a synthetic Engine lifecycle
        run: npm run test:main-engine-lifecycle
      - name: Exercise initially-offline Main startup recovery
        run: npm run test:main-network-startup
      - name: Preserve favorites and custom websites across upgrades
        run: npm run test:upgrade-compatibility
      - name: Exercise the School Profile registry inside a real ASAR
        run: npm run test:profile-asar
      - name: Exercise campus-browser toolbar IPC
        run: ./node_modules/.bin/electron e2e/campus-browser-toolbar.electron.js
      - name: Exercise Campus Browser MFA credential boundaries
        run: npm run test:campus-mfa-safety
      - name: Exercise popup and cross-origin MFA credential boundaries
        run: npm run test:campus-popup-mfa-safety
      - name: Exercise Chromium strict proxy authentication
        run: npm run test:strict-proxy-auth
      - name: Measure the resource manager at compact window sizes
        run: npm run test:renderer-layout
      - name: Run browser tab-switch and lifecycle soak gate
        run: npm run test:browser-performance
      - name: Verify routing rules survive a real app restart
        run: npm run test:routing-restart
      - name: Record the bounded hidden-idle baseline
        run: npm run test:idle-performance

  windows-private-file:
    timeout-minutes: 10
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install test dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build native Windows private-file helper
        run: npm run build:windows-private-file
      - name: Verify Windows private files, legacy upgrade, and packaged school discovery
        run: >-
          node --test
          test/unit/platform/storage/windows-private-file.test.js
          test/unit/persistence/migration/legacy-hkust/legacy-flat-source-receipts.test.js
          test/unit/app/startup/multi-school-startup-runtime.test.js
          test/integrations/platform/windows-platform-smoke.test.js
      - name: Verify current-user-only helper credential DACL
        run: node --test test/unit/integrations/external-proxy-config.test.js
      - name: Install pinned Rust toolchain for pipe regression
        working-directory: independent
        run: rustup show active-toolchain
      - name: Verify real Windows ProxyCommand pipes
        working-directory: independent
        run: cargo test --locked --no-default-features --test proxy_command_pipe

  engine:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: independent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Run engine tests
        run: cargo test --locked --no-default-features
      - name: Lint explicit compatibility laboratory
        run: cargo clippy --locked --all-targets --no-default-features --features compatibility-lab -- -D warnings
      - name: Preserve compatibility laboratory tests
        run: cargo test --locked --no-default-features --features compatibility-lab
      - name: Lint the feature-gated Engine lifecycle fixture
        run: cargo clippy --locked --all-targets --no-default-features --features engine-lifecycle-fixture -- -D warnings
      - name: Exercise the successful Engine subprocess lifecycle
        run: cargo test --locked --no-default-features --features engine-lifecycle-fixture --test engine_success_lifecycle
      - name: Exercise the synthetic Engine/Desktop auth pipe
        run: node ../desktop/e2e/auth-control-fixture.js
      - name: Run offline performance disaster guards
        run: |
          cargo test --locked --release --no-default-features --lib offline_socks5_frontend_matrix -- \
            --ignored --nocapture --test-threads=1
          cargo test --locked --release --no-default-features --test poll_latency_probe \
            offline_netstack_poll_latency_matrix -- \
            --ignored --nocapture --test-threads=1
      - name: Build shipped native binaries
        run: cargo build --locked --release --no-default-features --bin ec-engine --bin ec-proxy-command --bin ec-gateway-probe
